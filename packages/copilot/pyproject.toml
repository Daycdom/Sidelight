[project]
name = "sidelight-copilot"
version = "0.0.1"
description = "Live AI suggestions for the window you choose, built on the Sidelight packages."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Dominic" }]
dependencies = ["sidelight-common", "sidelight-reader", "sidelight-redact", "sidelight-router", "sidelight-voice"]

[project.scripts]
sidelight = "sidelight_copilot.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidelight_copilot"]

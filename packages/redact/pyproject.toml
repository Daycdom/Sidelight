[project]
name = "sidelight-redact"
version = "0.0.1"
description = "Finds and masks sensitive data in text, fully on-device."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Dominic" }]
dependencies = ["sidelight-common"]

[project.scripts]
sidelight-redact = "sidelight_redact.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidelight_redact"]

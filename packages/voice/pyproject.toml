[project]
name = "sidelight-voice"
version = "0.0.1"
description = "Local read-aloud and push-to-talk dictation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Dominic" }]
dependencies = ["sidelight-common"]

[project.scripts]
sidelight-voice = "sidelight_voice.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidelight_voice"]
